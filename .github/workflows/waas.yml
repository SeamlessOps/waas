name: GitOps Workflow as a Service (Unified WaaS)

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Dry run mode'
        required: false
        type: boolean
        default: false
      project_type:
        description: 'Project type (dotnet, nx, node, python, etc)'
        required: true
        type: string
      dotnet_version:
        description: '.Net version'
        required: false
        type: string
        default: '9.0.x'
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22.2.x'
      services_file:
        description: 'Services file (YAML or JSON). The extension may be left off: the one of .yaml, .yml or .json that exists is read'
        required: false
        type: string
        default: '${{ github.event.repository.name }}'
      services_catalog:
        description: >-
          Shared services file (YAML or JSON, the extension optional), in services_dir. A repository without its own
          services file is looked up here by its name.
        required: false
        type: string
        default: 'services'
      services_dir:
        description: 'Directory containing service files'
        required: false
        type: string
        default: '.github/workflows/services'
      load_default:
        description: 'Decide to load from default service_dir or custom one'
        required: false
        type: boolean
        default: true
      dockerfile:
        description: 'Dockerfile path for image building'
        required: false
        type: string
        default: 'Dockerfile'
      monorepo:
        description: 'Monorepo identifier'
        required: false
        type: boolean
        default: true
      dashboard_url:
        description: "Link to a deployment in the GitOps controller (e.g. Argo CD), shown in the run's summary; {environment} and {app} (the service's values file, environment/<environment>/<app>.yaml) are filled in. Empty: no link"
        required: false
        type: string
        default: ''
      service:
        description: 'Service name. Required if monorepo is disabled'
        required: false
        type: string
        default: ${{ github.event.repository.name }}

defaults:
  run:
    shell: bash

jobs:
  # ----------------------------------------
  # Step 1: PR Validation and Security Scan
  # ----------------------------------------
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Branch Rules
        id: validate
        uses: rollwright/waas/workflow-templates/shared/validate-pull-request@main

  # -----------------------------
  # Step 2: Plan
  # -----------------------------
  plan:
    if: >
      contains(github.event.head_commit.message, 'Merge pull request #')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      environment: ${{ steps.plan.outputs.environment }}
      domain: ${{ steps.plan.outputs.domain }}
      config: ${{ steps.plan.outputs.config }}
      matrix: ${{ steps.plan.outputs.matrix }}
      promote_from_environment: ${{ steps.plan.outputs.promote_from_environment }}
      promote_from_domain: ${{ steps.plan.outputs.promote_from_domain }}
      signing_key: ${{ steps.plan.outputs.signing_key }}
      signing_keyless: ${{ steps.plan.outputs.signing_keyless }}
      signing_identity: ${{ steps.plan.outputs.signing_identity }}
      signing_issuer: ${{ steps.plan.outputs.signing_issuer }}
    steps:      
      - name: Plan
        id: plan
        uses: rollwright/waas/workflow-templates/workload/waas/plan@main
        with:
          monorepo: ${{ inputs.monorepo }}
          service: ${{ inputs.service }}
          services_file: ${{ inputs.services_file }}
          catalog_file: ${{ inputs.services_catalog }}
          services_dir: ${{ inputs.services_dir }}
          load_default: ${{ inputs.load_default }}
          project_type: ${{ inputs.project_type }}
          vault_addr: ${{ secrets.VAULT_ADDR }}
          vault_role: ${{ secrets.VAULT_ROLE }}
          vault_secret_path: ${{ secrets.VAULT_SECRET_PATH }}

  # --------------------------
  # Step 3: Dynamic Deployment
  # --------------------------
  deploy:
    name: deploy-${{ needs.plan.outputs.environment }} (${{ matrix.service.name }})
    needs: [plan]
    environment: ${{ needs.plan.outputs.environment }}
    runs-on: ubuntu-latest
    if: >
      inputs.dry-run == false && needs.plan.outputs.deploy == 'true' &&
      needs.plan.outputs.matrix != '[]'
    env:
      PROJECT_TYPE: ${{ inputs.project_type }}
      CONFIG: ${{ needs.plan.outputs.config }}
      DIRECTORY: ${{ matrix.service.directory }}
      DOTNET_VERSION: ${{ inputs.dotnet_version }}
      DOMAIN: ${{ needs.plan.outputs.domain }}
      ENVIRONMENT: ${{ needs.plan.outputs.environment }}
      SERVICE: ${{ matrix.service.name }}
      NX_PROJECT: ${{ matrix.service.nx_project || matrix.service.name }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.plan.outputs.matrix) }}
      fail-fast: false
    outputs:
      duration: ${{ steps.deploy.outputs.duration }}
      no-changes: ${{ steps.deploy.outputs.no-changes }}
      environment: ${{ env.ENVIRONMENT }}
      service: ${{ env.SERVICE }}
    steps:
      - name: Deploy ${{ env.SERVICE }} to ${{ env.ENVIRONMENT }}
        id: deploy
        uses: rollwright/waas/workflow-templates/workload/waas/deploy@main
        with:
          build_configuration: ${{ env.CONFIG }}
          environment: ${{ env.ENVIRONMENT }}
          directory: ${{ env.DIRECTORY}}
          dotnet_version: ${{ env.DOTNET_VERSION }}
          dockerfile: ${{ inputs.dockerfile }}
          nx_project: ${{ env.NX_PROJECT }}
          project_type: ${{ env.PROJECT_TYPE }}
          service: ${{ env.SERVICE }}-${{ env.DOMAIN }}
          gitops: ${{ matrix.service.gitops && toJSON(matrix.service.gitops) || '' }}
          dashboard_url: ${{ inputs.dashboard_url }}
          signing_key: ${{ needs.plan.outputs.signing_key }}
          signing_keyless: ${{ needs.plan.outputs.signing_keyless }}
          signing_identity: ${{ needs.plan.outputs.signing_identity }}
          signing_issuer: ${{ needs.plan.outputs.signing_issuer }}
          vault_addr: ${{ secrets.VAULT_ADDR }}
          vault_role: ${{ secrets.VAULT_ROLE }}
          vault_secret_path: ${{ secrets.VAULT_SECRET_PATH }}

  # ----------------------------
  # Step 4: Slack Notification
  # ----------------------------
  notify:
    needs: [plan, deploy]
    name: notify-slack
    runs-on: ubuntu-latest
    if: >
      always() && inputs.dry-run == false && needs.plan.outputs.deploy == 'true' &&
      github.event_name != 'pull_request' && 
      needs.deploy.outputs.no-changes != 'true' 
    steps:
      - name: Notify Slack
        id: slack-notify
        uses: rollwright/waas/workflow-templates/shared/slack-notify@main
        with:
          workflow_type: workload
          service: ${{ github.event.repository.name }}
          environment: ${{ needs.deploy.outputs.environment }}
          status: ${{ needs.deploy.result }}
          needs_result: ${{ needs.deploy.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}
