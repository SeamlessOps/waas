name: Go

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'cmd/**'
      - 'internal/**'
      - 'Makefile'
      - '.github/workflows/go.yml'
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'cmd/**'
      - 'internal/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check
        run: make check
