name: Release

# A pushed version tag (v1.2.3) releases WaaS: the waas CLI's binaries are
# built, their checksums signed, and both published on a GitHub Release, where
# the setup-waas action downloads and verifies them; the major tag (v1) moves
# to the release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write  # keyless signing with this workflow's identity

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check
        run: make check

      - name: Build
        run: make dist VERSION=${{ github.ref_name }} && cat dist/checksums.txt

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Verify the signature and checksums
        working-directory: dist
        run: |
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --verify-tag

      - name: Move the major tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          major=${VERSION%%.*}
          git tag -f "$major" "$VERSION"
          git push -f origin "refs/tags/$major"
