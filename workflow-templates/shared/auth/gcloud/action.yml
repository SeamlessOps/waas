name: 'Authenticate with Google Cloud'
description: >-
  Signs in to Google Cloud through Workload Identity (WORKLOAD_SA_EMAIL, WORKLOAD_IDENTITY_PROVIDER, GKE_PROJECT from
  the environment) and, given a registry, lets Docker push to it.
inputs:
  registry:
    description: 'An image registry path, such as europe-docker.pkg.dev/project/repo; Docker is configured for its host. Empty: Docker is not configured'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v3
      with:
        service_account: ${{ env.WORKLOAD_SA_EMAIL }}
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        project_id: ${{ env.GKE_PROJECT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3.0.1
      
    - name: Configure Docker auth
      if: inputs.registry != ''
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
