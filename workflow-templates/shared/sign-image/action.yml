name: 'Sign Image'
description: >-
  Signs an image by digest with cosign: with a key (signatures stay in the registry, nothing goes to a public
  transparency log), or keyless with the workflow's GitHub identity (recorded in Sigstore's public log). Does
  nothing when neither is given. The job must already be logged in to the registry; keyless needs id-token: write.

inputs:
  image:
    description: 'The image, as name:tag or name@digest'
    required: true
  key:
    description: 'A cosign key reference (gcpkms://..., awskms://..., a file). Empty with keyless false: no signing'
    required: false
    default: ''
  keyless:
    description: "Sign keyless with the workflow's identity"
    required: false
    default: 'false'

outputs:
  signed:
    description: "'true' when the image was signed"
    value: ${{ steps.sign.outputs.signed || 'false' }}
  digest_ref:
    description: 'The signed image, as name@digest'
    value: ${{ steps.sign.outputs.digest_ref }}

runs:
  using: "composite"
  steps:
    - uses: sigstore/cosign-installer@v4.1.3
      if: inputs.key != '' || inputs.keyless == 'true'

    - name: Sign
      id: sign
      if: inputs.key != '' || inputs.keyless == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        KEY: ${{ inputs.key }}
      run: |
        set -euo pipefail
        # Sign the digest, never a tag: a tag can be moved to other content.
        # The repository: drop a digest, then a tag (a colon after the last
        # slash; one before it is a registry port).
        name="${IMAGE%@*}"
        [[ "${name##*/}" == *:* ]] && name="${name%:*}"
        digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
        ref="$name@$digest"
        if [[ -n "$KEY" ]]; then
          cosign sign --yes --key "$KEY" --tlog-upload=false "$ref"
        else
          cosign sign --yes "$ref"
        fi
        echo "signed=true" >> "$GITHUB_OUTPUT"
        echo "digest_ref=$ref" >> "$GITHUB_OUTPUT"
        echo "[INFO] - Signed $ref"
