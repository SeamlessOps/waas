name: 'Set up the WaaS CLI'
description: >-
  Puts the waas CLI on PATH: the released binary for the runner's OS and architecture, downloaded from the
  repository this action comes from, its checksums' signature verified as made by that repository's release
  workflow, and the binary checked against them. While a repository has no release
  yet, the CLI is built from this action's own checkout instead (it needs Go).

inputs:
  version:
    description: 'The release to use, such as v1.2.3. Default: the latest release'
    required: false
    default: 'latest'

outputs:
  path:
    description: 'The waas binary'
    value: ${{ steps.setup.outputs.path }}
  version:
    description: 'The version set up'
    value: ${{ steps.setup.outputs.version }}

runs:
  using: "composite"
  steps:
    - uses: sigstore/cosign-installer@v4.1.3
    - name: Set up waas
      id: setup
      shell: bash
      env:
        REPOSITORY: ${{ github.action_repository }}
        VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        # The repository this action comes from: the context, else its install
        # path, .../_actions/<owner>/<repo>/<ref>/...
        if [[ -z "$REPOSITORY" && "$GITHUB_ACTION_PATH" =~ /_actions/([^/]+)/([^/]+)/ ]]; then
          REPOSITORY="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
        fi
        case "$RUNNER_OS_NAME" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "::error::waas is released for Linux and macOS, not $RUNNER_OS_NAME"; exit 1 ;;
        esac
        case "$RUNNER_ARCH_NAME" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::waas is released for x64 and arm64, not $RUNNER_ARCH_NAME"; exit 1 ;;
        esac

        bin="$RUNNER_TEMP/waas-bin"
        mkdir -p "$bin"
        asset="waas-$os-$arch"
        if [[ "$VERSION" == "latest" ]]; then
          base="https://github.com/$REPOSITORY/releases/latest/download"
        else
          base="https://github.com/$REPOSITORY/releases/download/$VERSION"
        fi

        if [[ -n "$REPOSITORY" ]] && curl -fsSL --retry 3 -o "$bin/$asset" "$base/$asset"; then
          curl -fsSL --retry 3 -o "$bin/checksums.txt" "$base/checksums.txt"
          curl -fsSL --retry 3 -o "$bin/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          # Signed by this repository's release workflow, at a version tag.
          cosign verify-blob "$bin/checksums.txt" --bundle "$bin/checksums.txt.sigstore.json" \
            --certificate-identity-regexp "^https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sum="sha256sum"; command -v sha256sum >/dev/null || sum="shasum -a 256"
          (cd "$bin" && grep " $asset\$" checksums.txt | $sum -c -)
          mv "$bin/$asset" "$bin/waas"
          chmod +x "$bin/waas"
        elif [[ "$VERSION" == "latest" ]]; then
          echo "[INFO] - $REPOSITORY has no waas release yet: building it from this action's checkout"
          go build -C "$GITHUB_ACTION_PATH/../../.." -o "$bin/waas" ./cmd/waas
        else
          echo "::error::No waas $VERSION release for $os/$arch in $REPOSITORY"
          exit 1
        fi

        echo "$bin" >> "$GITHUB_PATH"
        echo "path=$bin/waas" >> "$GITHUB_OUTPUT"
        echo "version=$("$bin/waas" version)" >> "$GITHUB_OUTPUT"
        echo "[INFO] - waas $("$bin/waas" version) ($os/$arch)"
