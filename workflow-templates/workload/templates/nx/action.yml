name: 'Build Nx Projects'
description: 'Nx reusable action for building Nx projects'

inputs:
  artifact_dir:
    description: 'Name of the build artifact directory'
    required: false
    default: 'dist'
  environment:
    description: 'Environment to update (development, staging, production)'
    required: true
  node_version:
    description: 'Node.js version'
    required: true
    default: '22.2.x'
  nx_project:
    description: 'Name of the Nx project to build (use "all" to build everything)'
    required: true

outputs:
  build-status:
    description: 'Whether the action was successful or not'
    value: ${{ steps.verify-artifacts.outputs.build-status }}

runs:
  using: "composite"
  steps:

    # -------------------------
    # Setup Node + Dependencies
    # -------------------------
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm install --legacy-peer-deps

    # -------------------------
    # Nx Build with Error Capture
    # -------------------------
    - name: Build Nx project with retry
      id: build-nx
      shell: bash
      env:
        NX_PROJECT: ${{ inputs.nx_project }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "[INFO] Running Nx build for project: $NX_PROJECT"

        set +e
        OUTPUT=$(npx nx build "$NX_PROJECT" --configuration="$ENVIRONMENT" 2>&1)
        EXIT_CODE=$?
        set -e

        echo "$OUTPUT"

        # Save raw output
        echo "nx_output<<EOF" >> $GITHUB_OUTPUT
        echo "$OUTPUT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        # Detect OOM
        if echo "$OUTPUT" | grep -q "JavaScript heap out of memory"; then
          echo "[WARN] OOM detected. Retrying with increased heap..."
          echo "## ⚠️ Nx Build OOM Detected — Retrying" >> $GITHUB_STEP_SUMMARY

          set +e
          OUTPUT=$(NODE_OPTIONS="--max-old-space-size=4096" npx nx build "$NX_PROJECT" --configuration="$ENVIRONMENT" 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          echo "nx_output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

        if [ $EXIT_CODE -ne 0 ]; then
          echo "## ❌ Nx Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** $NX_PROJECT" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Error Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "build-status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi

        echo "[SUCCESS] Nx build completed"
        echo "build-status=success" >> $GITHUB_OUTPUT

    # -------------------------
    # Verify Artifacts
    # -------------------------
    - name: Wait for File System Sync
      shell: bash
      if: success()
      run: |
        echo "[INFO] - Waiting for file system to sync..."
        sleep 5
        sync

    - name: Verify Build Artifacts
      id: verify-artifacts
      shell: bash
      if: always()
      env:
        NX_PROJECT: ${{ inputs.nx_project }}
        ARTIFACT_DIR: ${{ inputs.artifact_dir }}
      run: |
        echo "=== Verifying Build Artifacts ==="

        if [ ! -d "$ARTIFACT_DIR" ]; then
          echo "## ❌ Build Verification Failed" >> $GITHUB_STEP_SUMMARY
          echo "**Error**: Artifact directory '$ARTIFACT_DIR' not found" >> $GITHUB_STEP_SUMMARY
          echo "build-status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi

        echo "[INFO] Artifact directory found"

        if [ "$NX_PROJECT" = "all" ]; then
          if [ -z "$(ls -A "$ARTIFACT_DIR")" ]; then
            echo "## ❌ Build Verification Failed" >> $GITHUB_STEP_SUMMARY
            echo "**Error**: Artifact directory '$ARTIFACT_DIR' is empty" >> $GITHUB_STEP_SUMMARY
            echo "build-status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "build-status=success" >> $GITHUB_OUTPUT
          exit 0
        fi

        PROJECT_PATH="$ARTIFACT_DIR/apps/$NX_PROJECT"

        if [ ! -d "$PROJECT_PATH" ]; then
          echo "## ❌ Build Verification Failed" >> $GITHUB_STEP_SUMMARY
          echo "**Error**: Project '$NX_PROJECT' not found in artifact directory" >> $GITHUB_STEP_SUMMARY
          echo "build-status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi

        echo "[SUCCESS] Build artifacts verified"
        echo "build-status=success" >> $GITHUB_OUTPUT
