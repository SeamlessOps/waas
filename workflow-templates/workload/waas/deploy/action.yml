name: 'WaaS Deploy'
description: 'Deploys workload to multiple configured environments'
inputs:
  service:
    description: 'Service name'
    required: true
  service_type:
    description: 'Service type'
    required: false
    default: 'unknown'
  directory:
    description: 'Service directory to build'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  docker_target:
    description: 'Dockerfile stage to build (--target). Empty builds the last stage'
    required: false
    default: ''
  project_type:
    description: 'Project type'
    required: false
    default: 'generic'
  project_list:
    description: 'List of projects to build'
    required: false
    default: '("generic" "dotnet" ".net" "nx" "node" "python" "java")'
  build_configuration:
    description: 'Build Configuration to use for .NET project'
    required: false
    default: 'Release'
  dotnet_version:
    description: '.NET version'
    required: false
  nx_project:
    description: 'Name of the Nx project to build (use "all" to build everything)'
    required: false
  node_version:
    description: 'Node.js version'
    required: false
  environment:
    description: 'Environment to update (development, staging, production)'
    required: true
  gitops_repo:
    description: 'GitOps repository URL'
    required: false
    default: 'rollwright/products.git'
  git_ref:
    description: 'The GitOps branch to use'
    required: false
    default: 'main'
  vault_addr:
    description: 'Vault address'
    required: true
  vault_role:
    description: 'Vault role'
    required: true
  vault_secret_path:
    description: 'Vault secret path'
    required: true
  github_packages:
    description: >-
      Give the restore and the image build read access to GitHub Packages with the workflow's GITHUB_TOKEN
      (the caller grants "packages: read"). The image build gets the build secrets "github_token" and "nuget_auth".
    required: false
    default: 'false'
  nuget_sources:
    description: 'Comma-separated nuget.config source keys that are GitHub Packages feeds (with github_packages)'
    required: false
    default: ''
  promote:
    description: >-
      Promote the source environment's image (promote_from_service) instead of building, when it is the code being
      deployed. On by default. Images must take their settings at runtime (the frontends generate theirs at start).
    required: false
    default: 'true'
  promote_from_service:
    description: "The service's values key in the source environment (e.g. api-staging). Empty: always build"
    required: false
    default: ''
  promote_from_environment:
    description: 'The source environment (e.g. staging)'
    required: false
    default: ''

  dashboard_url:
    description: "Link to the deployment in the GitOps controller (e.g. Argo CD), {environment} replaced. Empty: no link"
    required: false
    default: ''
  signing_key:
    description: 'A cosign key reference to sign images with (gcpkms://...). Empty, and signing_keyless not true: not signed'
    required: false
    default: ''
  signing_keyless:
    description: "'true': sign keyless with the workflow's GitHub identity"
    required: false
    default: ''
  signing_identity:
    description: "Keyless signing: a regular expression of the workflow identities trusted to sign"
    required: false
    default: ''
  signing_issuer:
    description: 'Keyless signing: the OIDC issuer'
    required: false
    default: 'https://token.actions.githubusercontent.com'

outputs:
  duration:
    description: 'Duration of the Deployment'
    value: ${{ steps.calculate-duration.outputs.duration }}
  no-changes:
    description: 'Toggle to skip build and publish if image is up-to-date'
    value: ${{ steps.confirm-image-tag.outputs.no-changes || 'false' }}
  promoted:
    description: "'true' when the source environment's image was promoted instead of built"
    value: ${{ steps.promote.outputs.promoted || 'false' }}
  projectStatus:
    description: 'Project build status'
    value: ${{ steps.determine-project-status.outputs.projectStatus }}
  status:
    description: 'Docker build status'
    value: ${{ steps.determine-project-status.outputs.projectStatus }}

runs:
  using: "composite"
  steps:
    - name: Authenticate with Vault and Retrieve Secrets 
      id: secretdata
      uses: rollwright/waas/workflow-templates/shared/auth/vault@main
      with:
        vault_addr: ${{ inputs.vault_addr }}
        vault_role: ${{ inputs.vault_role }}
        vault_secret_path: ${{ inputs.vault_secret_path }}

    - name: Promote the source environment's image
      id: promote
      if: inputs.promote == 'true' && inputs.promote_from_service != '' && inputs.promote_from_environment != ''
      uses: rollwright/waas/workflow-templates/workload/shared/promote-image@main
      with:
        service: ${{ inputs.service }}
        source_service: ${{ inputs.promote_from_service }}
        source_environment: ${{ inputs.promote_from_environment }}
        environment: ${{ inputs.environment }}
        artifact_registry: ${{ env.ARTIFACT_REGISTRY }}
        git_token: ${{ env.GIT_TOKEN }}
        gitops_repo: ${{ inputs.gitops_repo }}
        git_ref: ${{ inputs.git_ref }}
        dashboard_url: ${{ inputs.dashboard_url }}
        signing_key: ${{ inputs.signing_key }}
        signing_keyless: ${{ inputs.signing_keyless }}
        signing_identity: ${{ inputs.signing_identity }}
        signing_issuer: ${{ inputs.signing_issuer }}
        github_token: ${{ github.token }}

    - name: Confirm if Image Tag Needs Update
      id: confirm-image-tag
      if: steps.promote.outputs.promoted != 'true'
      uses: rollwright/waas/workflow-templates/workload/shared/gitops-repo/confirm-image-tag@main
      with:
        service: ${{ inputs.service }}
        environment: ${{ inputs.environment }}
        git_token: ${{ env.GIT_TOKEN }}
        gitops_repo: ${{ inputs.gitops_repo }}
        git_ref: ${{ inputs.git_ref }}
        dashboard_url: ${{ inputs.dashboard_url }}
    
    - name: Set start timestamp
      id: start-time
      if: steps.promote.outputs.promoted != 'true' && steps.confirm-image-tag.outputs.no-changes != 'true'
      shell: bash
      run: |
        echo "timestamp=$EPOCHSECONDS" >> "$GITHUB_OUTPUT"

    - name: Validate project type
      id: validate-project-type
      if: steps.promote.outputs.promoted != 'true' && steps.confirm-image-tag.outputs.no-changes != 'true'
      shell: bash
      env:
        PROJECT_TYPE: ${{ inputs.project_type }}
        SUPPORTED_TYPES: ${{ inputs.project_list }}
      run: |
        VALID_PROJECT_TYPE="false"

        echo "[INFO] - Raw project type: $PROJECT_TYPE"
        echo "[INFO] - Supported types: ${SUPPORTED_TYPES[*]}"

        # Convert to lowercase
        PROJECT_TYPE=$(echo "$PROJECT_TYPE" | tr '[:upper:]' '[:lower:]')
        echo "[INFO] - Normalized project type: $PROJECT_TYPE"

        # Convert SUPPORTED_TYPES string → bash array
        eval "SUPPORTED_ARRAY=${SUPPORTED_TYPES}"

        # Validate project type
        if [[ ! " ${SUPPORTED_ARRAY[@]} " =~ " ${PROJECT_TYPE} " ]]; then
          echo "[INFO] - ❌ Unsupported project type: $PROJECT_TYPE"
          echo "[INFO] - ✅ Supported types: ${SUPPORTED_ARRAY[*]}"
          echo "## ❌ Unsupported project type: $PROJECT_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "✅ Supported types: ${SUPPORTED_ARRAY[*]}" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "[INFO] - ✅ Valid project type: $PROJECT_TYPE"
          VALID_PROJECT_TYPE="true"
        fi

        echo "project-type=$PROJECT_TYPE" >> $GITHUB_OUTPUT
        echo "valid-project-type=$VALID_PROJECT_TYPE" >> $GITHUB_OUTPUT
    
    - name: Checkout Repository
      if: steps.promote.outputs.promoted != 'true' && steps.confirm-image-tag.outputs.no-changes != 'true'
      id: checkout-repository
      uses: actions/checkout@v5

    - name: Build .NET Project
      id: build-dotnet
      if: >
        steps.validate-project-type.outputs.project-type == 'dotnet' || 
        steps.validate-project-type.outputs.project-type == '.net'
      uses: rollwright/waas/workflow-templates/workload/templates/dotnet@main
      with:
        directory: ${{ inputs.directory }}
        dotnet_version: ${{ inputs.dotnet_version }}
        github_packages: ${{ inputs.github_packages }}
        nuget_sources: ${{ inputs.nuget_sources }}
        package_user: ${{ github.actor }}
        package_token: ${{ github.token }}

    - name: Build Nx Project
      id: build-nx
      if: steps.validate-project-type.outputs.project-type == 'nx'
      uses: rollwright/waas/workflow-templates/workload/templates/nx@main
      with:
        nx_project: ${{ inputs.nx_project }}
        environment: ${{ inputs.environment }}
        node_version: ${{ inputs.node_version }}

    - name: Determine project status
      id: determine-project-status
      if: failure()
      shell: bash
      env:
        projectStatus: failure
      run: |
        echo "[INFO] Final project status determined: $projectStatus"
        echo "projectStatus=$projectStatus" >> $GITHUB_OUTPUT

    - name: Build and Publish Docker Image
      id: build-and-publish
      if: >
        steps.confirm-image-tag.outputs.no-changes!= 'true' && 
        steps.validate-project-type.outputs.valid-project-type == 'true'
      uses: rollwright/waas/workflow-templates/workload/shared/build-and-publish@main
      with:
        artifact_registry: ${{ env.ARTIFACT_REGISTRY }}
        build_configuration: ${{ inputs.build_configuration }}
        directory: ${{ inputs.directory }}
        dockerfile: ${{ inputs.dockerfile }}
        docker_target: ${{ inputs.docker_target }}
        environment: ${{ inputs.environment }}
        git_token: ${{ env.GIT_TOKEN }}
        gitops_repo: ${{ inputs.gitops_repo }}
        git_ref: ${{ inputs.git_ref }}
        dashboard_url: ${{ inputs.dashboard_url }}
        signing_key: ${{ inputs.signing_key }}
        signing_keyless: ${{ inputs.signing_keyless }}
        signing_identity: ${{ inputs.signing_identity }}
        signing_issuer: ${{ inputs.signing_issuer }}
        nx_project: ${{ inputs.nx_project }}
        project_type: ${{ inputs.project_type }}
        service: ${{ inputs.service }}
        github_packages: ${{ inputs.github_packages }}
        package_user: ${{ github.actor }}
        package_token: ${{ github.token }}

    - name: Calculate duration
      id: calculate-duration
      if: >
        always() && 
        steps.confirm-image-tag.outputs.no-changes!= 'true' && 
        steps.validate-project-type.outputs.valid-project-type == 'true'
      shell: bash
      run: |
        echo "Start time from outputs: ${{ steps.start-time.outputs.timestamp }}"
        echo "Current time (EPOCHSECONDS): $EPOCHSECONDS"
        echo "Current time (date +%s): $(date +%s)"
        
        current_time=$EPOCHSECONDS
        start_time=${{ steps.start-time.outputs.timestamp }}
        duration=$((current_time - start_time))
        
        echo "Calculated duration: $duration seconds"
        echo "duration=$duration" >> $GITHUB_OUTPUT

    - name: Determine docker build status
      id: determine-status
      if: >
        always() &&
        steps.confirm-image-tag.outputs.no-changes != 'true' && 
        steps.validate-project-type.outputs.valid-project-type == 'true'
      shell: bash
      run: |
        if [[ "${{ steps.build-and-publish.outcome }}" == "success" ]]; then
          status="success"
        elif [[ "${{ steps.build-and-publish.outcome }}" == "failure" ]]; then
          status="failure"
        else
          status="unknown"
        fi

        # 1. Prefer output if build step reported failure
        if [[ -n "${{ steps.determine-project-status.outputs.projectStatus }}" ]]; then
          status="${{ steps.determine-project-status.outputs.projectStatus }}"
        fi

        # 2. Override with explicit output from build-and-publish if available
        if [[ -n "${{ steps.build-and-publish.outputs.status }}" ]]; then
          status="${{ steps.build-and-publish.outputs.status }}"
        fi

        echo "[INFO] Final status determined: $status"
        echo "status=$status" >> $GITHUB_OUTPUT

    - name: Collect Metrics for ${{ inputs.service }}
      id: collect-metrics
      if: >
        always() &&
        steps.confirm-image-tag.outputs.no-changes!= 'true' && 
        steps.validate-project-type.outputs.valid-project-type == 'true'
      uses: rollwright/waas/workflow-templates/workload/utils/collect-metrics@main
      with:
        service: ${{ inputs.service }}
        service_type: ${{ inputs.service_type }}
        environment: ${{ inputs.environment }}
        status: ${{ steps.determine-status.outputs.status }}
        duration: ${{ steps.calculate-duration.outputs.duration }}
        image_tag: ${{ steps.build-and-publish.outputs.image_tag }}
        waas_api_url: ${{ env.WAAS_API_URL }}
        waas_api_key: ${{ env.WAAS_API_KEY }}
      continue-on-error: true
