name: 'WaaS Environment Router'
description: >-
  Routes a push to the environment its branch deploys to, and gives that environment's name, domain, build
  configuration and services. The environments come from the services file's metadata.environments (the loader's
  environments output); without them, from the staging_* and production_* inputs.

inputs:
  branch:
    description: 'The branch pushed to'
    required: false
    default: ${{ github.ref_name }}
  environments:
    description: "The services file's environments, as load-services-matrix's environments output. Empty: the inputs below"
    required: false
    default: ''
  services:
    description: 'Services per environment, as load-services-matrix''s services output'
    required: false
    default: ''
  staging_env:
    description: 'First environment, when the services file declares none'
    required: false
    default: 'staging'
  staging_branch:
    description: 'Branch that deploys to the first environment, when the services file declares none'
    required: false
    default: 'dev'
  staging_domain:
    description: "First environment's domain, when the services file declares none"
    required: false
    default: 'staging'
  staging_config:
    description: "First environment's build configuration, when the services file declares none"
    required: false
    default: 'Release'
  production_env:
    description: 'Second environment, when the services file declares none'
    required: false
    default: 'production'
  production_branch:
    description: 'Branch that deploys to the second environment, when the services file declares none'
    required: false
    default: 'main'
  production_domain:
    description: "Second environment's domain, when the services file declares none"
    required: false
    default: 'production'
  production_config:
    description: "Second environment's build configuration, when the services file declares none"
    required: false
    default: 'Release'
  staging_services:
    description: 'Services for the first environment, when services is not given'
    required: false
    default: ''
  production_services:
    description: 'Services for the second environment, when services is not given'
    required: false
    default: ''
  monorepo:
    description: 'The repository deploys several services'
    required: false
    default: 'true'
  service:
    description: "A polyrepo's service, deployed by name when no services were loaded"
    required: false
    default: ${{ github.event.repository.name }}

outputs:
  deploy:
    description: 'Whether the branch deploys anywhere'
    value: ${{ steps.route.outputs.deploy }}
  config:
    description: "The environment's build configuration"
    value: ${{ steps.route.outputs.config }}
  domain:
    description: "The environment's domain"
    value: ${{ steps.route.outputs.domain }}
  environment:
    description: 'The environment'
    value: ${{ steps.route.outputs.environment }}
  matrix:
    description: 'The services to deploy, as a JSON list'
    value: ${{ steps.route.outputs.matrix }}
  service:
    description: "A polyrepo's service name; empty for a monorepo"
    value: ${{ steps.route.outputs.service }}
  promote_from_environment:
    description: 'The environment before this one, whose image this one can promote; empty for the first'
    value: ${{ steps.route.outputs.promote_from_environment }}
  promote_from_domain:
    description: "That environment's domain"
    value: ${{ steps.route.outputs.promote_from_domain }}

runs:
  using: "composite"
  steps:
    - name: Build the WaaS CLI
      shell: bash
      run: go build -C "$GITHUB_ACTION_PATH/../../../.." -o "$RUNNER_TEMP/waas" ./cmd/waas

    - name: Route
      id: route
      shell: bash
      env:
        # JSON goes through the environment, never into the script's text: a
        # quote in any field would end the shell string.
        BRANCH: ${{ inputs.branch }}
        ENVIRONMENTS: ${{ inputs.environments }}
        SERVICES: ${{ inputs.services }}
        STAGING_SERVICES: ${{ inputs.staging_services }}
        PRODUCTION_SERVICES: ${{ inputs.production_services }}
        MONOREPO: ${{ inputs.monorepo }}
        SERVICE: ${{ inputs.service }}
        STAGING_ENV: ${{ inputs.staging_env }}
        STAGING_BRANCH: ${{ inputs.staging_branch }}
        STAGING_DOMAIN: ${{ inputs.staging_domain }}
        STAGING_CONFIG: ${{ inputs.staging_config }}
        PRODUCTION_ENV: ${{ inputs.production_env }}
        PRODUCTION_BRANCH: ${{ inputs.production_branch }}
        PRODUCTION_DOMAIN: ${{ inputs.production_domain }}
        PRODUCTION_CONFIG: ${{ inputs.production_config }}
      run: |
        # Services per environment: the loader's map, else the two lists
        # keyed by the environments' names.
        if [[ -z "$SERVICES" && ( -n "$STAGING_SERVICES" || -n "$PRODUCTION_SERVICES" ) ]]; then
          SERVICES=$(jq -cn --arg s "$STAGING_ENV" --arg p "$PRODUCTION_ENV" \
            --argjson sv "${STAGING_SERVICES:-null}" --argjson pv "${PRODUCTION_SERVICES:-null}" \
            '{} | if $sv != null then .[$s] = $sv else . end | if $pv != null then .[$p] = $pv else . end')
        fi
        "$RUNNER_TEMP/waas" route --branch "$BRANCH" --environments "$ENVIRONMENTS" --services "$SERVICES" \
          --monorepo="$MONOREPO" --service "$SERVICE" \
          --staging-env "$STAGING_ENV" --staging-branch "$STAGING_BRANCH" \
          --staging-domain "$STAGING_DOMAIN" --staging-config "$STAGING_CONFIG" \
          --production-env "$PRODUCTION_ENV" --production-branch "$PRODUCTION_BRANCH" \
          --production-domain "$PRODUCTION_DOMAIN" --production-config "$PRODUCTION_CONFIG"
