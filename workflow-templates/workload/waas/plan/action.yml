name: 'WaaS Plan'
description: >-
  Plans a push: reads the services file and gives the environment the branch deploys to (from the file's
  metadata.environments, else dev to staging and main to production) and the services that deploy there.

inputs:
  project_type:
    description: 'Project type (dotnet, nx, node, python, etc)'
    required: false
  services_file:
    description: 'JSON file containing service definitions'
    required: false
  services_dir:
    description: 'Directory containing service files'
    required: false
  catalog_file:
    description: >-
      Shared services file, in services_dir. A repository without its own services file is looked up here: its
      entries are those whose "repository" is the repository's name (or, when none is, the entry whose "name" is
      the service input). One entry deploys as a polyrepo under the entry's "name"; several deploy as a monorepo.
      A service input naming one of the repository's entries picks that one.
    required: false
    default: 'services.json'
  repository:
    description: 'The repository name the catalog is searched by'
    required: false
    default: ${{ github.event.repository.name }}
  branch:
    description: "The branch pushed to; the services file's environments say where it deploys"
    required: false
    default: ${{ github.ref_name }}
  load_default:
    description: 'Decide to load from default service_dir or custom one'
    required: false
    type: boolean
  gitops_repo:
    description: 'GitOps repository URL'
    required: false
    default: 'rollwright/products.git'
  git_ref:
    description: 'The GitOps branch to use'
    required: false
    default: 'main'
  monorepo:
    description: 'Monorepo identifier'
    required: false
    type: boolean
    default: true
  service:
    description: 'Service name. Required if monorepo is disabled'
    required: false
    default: ${{ github.event.repository.name }}
  vault_addr:
    description: 'Vault address. Required if load_default is true'
    required: false
  vault_role:
    description: 'Vault role. Required if load_default is true'
    required: false
  vault_secret_path:
    description: 'Vault secret path. Required if load_default is true'
    required: false

outputs:
  regular-service:
    description: "Regular service name: the catalog entry's name when the repository has one entry there"
    value: ${{ steps.plan.outputs.service || steps.process-repo-type.outputs.service }}
  monorepo:
    description: 'Whether the repository deploys as a monorepo: from its number of entries when found in the catalog'
    value: ${{ steps.plan.outputs.monorepo || inputs.monorepo }}
  all-services:
    description: 'All services as JSON matrix'
    value: ${{ steps.plan.outputs.all-services }}
  staging-services:
    description: 'Services filtered for staging deployment'
    value: ${{ steps.plan.outputs.staging-services }}
  production-services:
    description: 'Services filtered for production deployment'
    value: ${{ steps.plan.outputs.production-services }}
  deploy:
    description: 'Whether the branch deploys anywhere'
    value: ${{ steps.plan.outputs.deploy }}
  environment:
    description: 'The environment the branch deploys to'
    value: ${{ steps.plan.outputs.environment }}
  domain:
    description: "The environment's domain"
    value: ${{ steps.plan.outputs.domain }}
  config:
    description: "The environment's build configuration"
    value: ${{ steps.plan.outputs.config }}
  matrix:
    description: 'The services deploying to the environment, as a JSON list'
    value: ${{ steps.plan.outputs.matrix }}
  promote_from_environment:
    description: 'The environment before this one, whose image this one can promote; empty for the first'
    value: ${{ steps.plan.outputs.promote_from_environment }}
  promote_from_domain:
    description: "That environment's domain"
    value: ${{ steps.plan.outputs.promote_from_domain }}
  signing_key:
    description: "The services file's signing key; empty when not signed with a key"
    value: ${{ steps.plan.outputs.signing_key }}
  signing_keyless:
    description: "'true' when images are signed keyless"
    value: ${{ steps.plan.outputs.signing_keyless }}
  signing_identity:
    description: 'Keyless signing: the workflow identities trusted to sign; empty when not keyless'
    value: ${{ steps.plan.outputs.signing_identity }}
  signing_issuer:
    description: 'Keyless signing: the OIDC issuer'
    value: ${{ steps.plan.outputs.signing_issuer }}

runs:
  using: "composite"
  steps:
    - name: Process Repository Type
      id: process-repo-type
      shell: bash
      env:
        MONOREPO: ${{ inputs.monorepo }}
        LOAD_DEFAULT: ${{ inputs.load_default }}
        VAULT_ADDR: ${{ inputs.vault_addr }}
        VAULT_ROLE: ${{ inputs.vault_role }}
        VAULT_SECRET_PATH: ${{ inputs.vault_secret_path }}
      run: |
        # load says whether a services file is read. A monorepo always reads
        # one. A polyrepo reads its own when it can reach it: the caller's
        # (load_default false), or the GitOps repo's with Vault credentials.
        # Without either it deploys by its name alone, as before.
        if [[ "$MONOREPO" == "true" ]]; then
          echo "monorepo=true" >> $GITHUB_OUTPUT
          echo "load=true" >> $GITHUB_OUTPUT
        else
          echo "monorepo=false" >> $GITHUB_OUTPUT
          echo "service=${{ inputs.service }}" >> $GITHUB_OUTPUT
          if [[ "$LOAD_DEFAULT" != "true" || ( -n "$VAULT_ADDR" && -n "$VAULT_ROLE" && -n "$VAULT_SECRET_PATH" ) ]]; then
            echo "load=true" >> $GITHUB_OUTPUT
          else
            echo "[INFO] - No Vault credentials: deploying ${{ inputs.service }} by name, without a services file"
            echo "load=false" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Ensure Vault Credentials are Available
      if: inputs.load_default == 'true' && steps.process-repo-type.outputs.load == 'true'
      shell: bash
      env:
        VAULT_ADDR: ${{ inputs.vault_addr }}
        VAULT_ROLE: ${{ inputs.vault_role }}
        VAULT_SECRET_PATH: ${{ inputs.vault_secret_path }}
      run: |
        MISSING_VARS=()
        [ -z "$VAULT_ADDR" ] && MISSING_VARS+=("VAULT_ADDR")
        [ -z "$VAULT_ROLE" ] && MISSING_VARS+=("VAULT_ROLE")
        [ -z "$VAULT_SECRET_PATH" ] && MISSING_VARS+=("VAULT_SECRET_PATH")

        if [ ${#MISSING_VARS[@]} -ne 0 ]; then
          echo "[INFO] - ❌ Missing Vault credential(s): ${MISSING_VARS[*]}"
          echo "[INFO] - ⚠️ Vault credentials are required if load_default is true"

          # Create step summary
          echo "## ❌ Vault Credentials Missing" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          for var in "${MISSING_VARS[@]}"; do
            echo "- $var" >> $GITHUB_STEP_SUMMARY
          done
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "### Available Options:" >> $GITHUB_STEP_SUMMARY
          echo "#### 1. Default GitOps Repository" >> $GITHUB_STEP_SUMMARY
          echo "To use the default GitOps repository:" >> $GITHUB_STEP_SUMMARY
          echo "- Provide vault credentials as inputs" >> $GITHUB_STEP_SUMMARY
          echo "- Follow the example shown below:" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "uses: rollwright/waas/workflow-templates/workload/waas/plan@v0" >> $GITHUB_STEP_SUMMARY
          echo "with:" >> $GITHUB_STEP_SUMMARY
          echo "  vault_addr: '<VAULT_ADDR>'" >> $GITHUB_STEP_SUMMARY
          echo "  vault_role: '<VAULT_ROLE>'" >> $GITHUB_STEP_SUMMARY
          echo "  vault_secret_path: '<VAULT_SECRET_PATH>'" >> $GITHUB_STEP_SUMMARY
          echo "  services_file: '<service-file-name.json>'" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "_Note: \`load_default\` is true by default so you don't need to set it._" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 2. Client (service) Repository" >> $GITHUB_STEP_SUMMARY
          echo "To use a custom service configuration in the service repository:" >> $GITHUB_STEP_SUMMARY
          echo "- Set \`load_default\` to false and provide your own \`services_dir\` and \`services_file\`" >> $GITHUB_STEP_SUMMARY
          echo "- Follow the example shown below:" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "uses: rollwright/waas/workflow-templates/workload/waas/plan@v0" >> $GITHUB_STEP_SUMMARY
          echo "with:" >> $GITHUB_STEP_SUMMARY
          echo "  load_default: false" >> $GITHUB_STEP_SUMMARY
          echo "  services_dir: '<path-to-services-dir>'" >> $GITHUB_STEP_SUMMARY
          echo "  services_file: '<service-file-name.json>'" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          # Validate Vault URL format
          if [[ ! "$VAULT_ADDR" =~ ^https?:// ]]; then
              echo "❌ VAULT_ADDR must be a valid URL starting with http:// or https://"
              echo "❌ VAULT_ADDR must be a valid URL starting with http:// or https://" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

          # Validate Vault role format
          if [[ ! "$VAULT_ROLE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "❌ VAULT_ROLE must only contain letters, numbers, underscores, or dashes"
              echo "❌ VAULT_ROLE must only contain letters, numbers, underscores, or dashes" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

          # Validate Vault secret path format
          if [[ ! "$VAULT_SECRET_PATH" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
              echo "❌ VAULT_SECRET_PATH must only contain letters, numbers, underscores, dots, slashes, or dashes"
              echo "❌ VAULT_SECRET_PATH must only contain letters, numbers, underscores, dots, slashes, or dashes" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi
          echo "[INFO] - All required Vault credentials are present ✅"
        fi

    - name: Authenticate with Vault and Retrieve Secrets
      id: secretdata
      if: inputs.load_default == 'true' && steps.process-repo-type.outputs.load == 'true'
      uses: rollwright/waas/workflow-templates/shared/auth/vault@main
      with:
        vault_addr: ${{ inputs.vault_addr }}
        vault_role: ${{ inputs.vault_role }}
        vault_secret_path: ${{ inputs.vault_secret_path }}

    - name: Checkout GitOps Repository
      uses: actions/checkout@v5
      if: inputs.load_default == 'true' && steps.process-repo-type.outputs.load == 'true'
      with:
        repository: ${{ inputs.gitops_repo }}
        token: ${{ env.GIT_TOKEN }}
        ref: ${{ inputs.git_ref }}
        sparse-checkout: ${{ inputs.services_dir }}
        sparse-checkout-cone-mode: false
        fetch-depth: 1

    - name: Checkout Repository (the caller's repository)
      if: inputs.load_default == 'false'
      uses: actions/checkout@v5

    - name: Skip Default GitOps Loading
      if: inputs.load_default == 'false'
      shell: bash
      env:
        SERVICES_DIR: "${{ inputs.services_dir }}"
        SERVICES_FILE: "${{ inputs.services_file }}"
      run: |
        echo "[INFO] - Skipping Vault and GitOps repo load (using caller-provided paths)."
        echo "[INFO] - 📁 Directory: $SERVICES_DIR"
        echo "[INFO] - 📝 File: $SERVICES_FILE"

    - name: Set up the WaaS CLI
      uses: rollwright/waas/workflow-templates/shared/setup-waas@main

    - name: Plan
      id: plan
      shell: bash
      env:
        SERVICES_FILE: "${{ inputs.services_dir }}/${{ inputs.services_file }}"
        CATALOG_FILE: ${{ inputs.catalog_file && format('{0}/{1}', inputs.services_dir, inputs.catalog_file) || '' }}
        REPOSITORY: ${{ inputs.repository }}
        BRANCH: ${{ inputs.branch }}
        MONOREPO: ${{ inputs.monorepo }}
        LOAD: ${{ steps.process-repo-type.outputs.load }}
        SERVICE: ${{ inputs.service }}
      run: |
        # What deploy needs: the environment the branch deploys to and
        # the services there. See "waas plan -h".
        args=(plan -f "$SERVICES_FILE" --repository "$REPOSITORY" --branch "$BRANCH" --service "$SERVICE" --monorepo="$MONOREPO")
        [[ -n "$CATALOG_FILE" ]] && args+=(--catalog "$CATALOG_FILE")
        # A polyrepo that can't read a services file deploys by its name.
        [[ "$LOAD" == "true" ]] || args+=(--by-name)
        waas "${args[@]}"
