name: 'Promote Image'
description: >-
  Promote the image another environment runs (staging) to this one instead of building it again: read that
  environment's tag from the GitOps values, check that its commit holds exactly the code being deployed, copy the
  image to this service's name (no rebuild, no layer upload) and write the tag. Outputs promoted=false when it
  can't (no tag there, or the code differs), so the caller builds as usual.

inputs:
  service:
    description: 'Service values key to update (e.g. api-production); also its image name'
    required: true
  source_service:
    description: 'Values key, and image name, of the service in the source environment (e.g. api-staging)'
    required: true
  source_environment:
    description: 'Environment whose image is promoted (e.g. staging)'
    required: true
  environment:
    description: 'Environment to update (e.g. production)'
    required: true
  target:
    description: 'Where the image is written in environment, as waas plan gives it ("gitops"). Empty: the default'
    required: false
    default: ''
  source_target:
    description: "Where the image is read in source_environment, as waas plan gives it (\"gitops_from\"). Empty: the default"
    required: false
    default: ''
  artifact_registry:
    description: 'Artifact Registry repository holding both images'
    required: true
  git_token:
    description: 'Token to read and update the GitOps repository'
    required: true
  gitops_repo:
    description: 'GitOps repository'
    required: false
    default: 'rollwright/products.git'
  git_ref:
    description: 'GitOps branch'
    required: false
    default: 'main'
  github_token:
    description: "Token to compare commits in the calling repository (the workflow's GITHUB_TOKEN)"
    required: true

  dashboard_url:
    description: "Link to the deployment in the GitOps controller (e.g. Argo CD); {environment} and {app} (the values file the service is in, environment/<environment>/<app>.yaml) are filled in. Empty: no link"
    required: false
    default: ''
  signing_key:
    description: 'A cosign key reference to sign images with (gcpkms://...). Empty, and signing_keyless not true: not signed'
    required: false
    default: ''
  signing_keyless:
    description: "'true': sign keyless with the workflow's GitHub identity"
    required: false
    default: ''
  signing_identity:
    description: "Keyless signing: a regular expression of the workflow identities trusted to sign"
    required: false
    default: ''
  signing_issuer:
    description: 'Keyless signing: the OIDC issuer'
    required: false
    default: 'https://token.actions.githubusercontent.com'

outputs:
  promoted:
    description: "'true' when the image was promoted and the tag written; 'false' when the caller should build"
    value: ${{ steps.decide.outputs.promote == 'true' && steps.update-gitops.outcome == 'success' && 'true' || 'false' }}
  image_tag:
    description: 'The promoted tag'
    value: ${{ steps.decide.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Find the source environment's values
      id: source
      uses: rollwright/waas/workflow-templates/workload/shared/gitops-repo/values-target@main
      with:
        target: ${{ inputs.source_target }}
        service: ${{ inputs.source_service }}
        environment: ${{ inputs.source_environment }}
        git_token: ${{ inputs.git_token }}
        gitops_repo: ${{ inputs.gitops_repo }}
        git_ref: ${{ inputs.git_ref }}
        checkout_path: .promote-gitops
        must_exist: 'false'   # none or several: build instead

    - name: Decide whether to promote
      id: decide
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_SERVICE: ${{ inputs.source_service }}
        SOURCE_ENV: ${{ inputs.source_environment }}
        REGISTRY: ${{ inputs.artifact_registry }}
        FOUND: ${{ steps.source.outputs.found }}
        FILE: ${{ steps.source.outputs.file }}
        TAG_AT: ${{ steps.source.outputs.tag }}
        REPOSITORY_AT: ${{ steps.source.outputs.repository }}
        REF_AT: ${{ steps.source.outputs.ref }}
      run: |
        set -euo pipefail
        # The image the source environment runs, from the fields its target names
        tag="" repo="$REGISTRY/$SOURCE_SERVICE"
        if [[ "$FOUND" == "true" ]]; then
          read_at() { [[ -n "$1" ]] && yq eval "$1 // \"\"" ".promote-gitops/$FILE" || true; }
          tag=$(read_at "$TAG_AT")
          if [[ -n "$REPOSITORY_AT" ]]; then
            r=$(read_at "$REPOSITORY_AT"); [[ -n "$r" ]] && repo="$r"
          fi
          if [[ -n "$REF_AT" ]]; then
            ref=$(read_at "$REF_AT"); ref="${ref%@*}"
            # registry/name:tag; a colon before the last / is a registry port
            if [[ "${ref##*/}" == *:* ]]; then tag="${ref##*:}"; repo="${ref%:*}"; fi
          fi
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "repository=$repo" >> "$GITHUB_OUTPUT"
        if [[ ! "$tag" =~ -sha-([0-9a-f]{7,40})$ ]]; then
          echo "[INFO] - No promotable tag for $SOURCE_SERVICE in $SOURCE_ENV ('$tag'): building"
          echo "promote=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        sha="${BASH_REMATCH[1]}"
        # Same code: comparing the tag's commit with the one being deployed lists no changed file. Holds for merge
        # and squash merges alike; a newer dev (staging ahead of what was merged) shows files and builds instead.
        if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq '.files | length' 2>/dev/null); then
          echo "[INFO] - Can't compare $sha with $GITHUB_SHA: building"
          echo "promote=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [[ "$files" != "0" ]]; then
          echo "[INFO] - $SOURCE_ENV's $tag differs from $GITHUB_SHA ($files files): building"
          echo "promote=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        echo "[INFO] - $SOURCE_ENV's $tag is the code being deployed: promoting"
        echo "promote=true" >> "$GITHUB_OUTPUT"

    - name: Authenticate with Google Cloud
      if: steps.decide.outputs.promote == 'true'
      uses: rollwright/waas/workflow-templates/shared/auth/gcloud@main
      with:
        registry: ${{ inputs.artifact_registry }}

    - name: Set up Docker Buildx
      if: steps.decide.outputs.promote == 'true'
      uses: docker/setup-buildx-action@v4.0.0

    # Only an image this workflow signed is promoted; any other is built
    # again, signed, by the caller.
    - name: Verify the source image
      id: verify
      if: steps.decide.outputs.promote == 'true'
      uses: rollwright/waas/workflow-templates/shared/verify-image@main
      with:
        image: ${{ steps.decide.outputs.repository }}:${{ steps.decide.outputs.tag }}
        key: ${{ inputs.signing_key }}
        keyless: ${{ inputs.signing_keyless }}
        identity: ${{ inputs.signing_identity }}
        issuer: ${{ inputs.signing_issuer }}

    - name: Copy the image
      id: copy
      if: steps.decide.outputs.promote == 'true' && steps.verify.outputs.verified == 'true'
      continue-on-error: true   # a failed copy leaves promoted=false: the caller builds instead
      shell: bash
      env:
        SRC: ${{ steps.decide.outputs.repository }}:${{ steps.decide.outputs.tag }}
        DST: ${{ inputs.artifact_registry }}/${{ inputs.service }}:${{ steps.decide.outputs.tag }}
      run: |
        set -euo pipefail
        # A manifest copy inside one registry: the layers are mounted, not pulled and pushed again
        docker buildx imagetools create --tag "$DST" "$SRC"
        echo "[INFO] - Promoted $SRC -> $DST"

    - name: Sign the promoted image
      id: sign
      if: steps.copy.outcome == 'success'
      continue-on-error: true   # unsigned: the tag is not written, and the caller builds
      uses: rollwright/waas/workflow-templates/shared/sign-image@main
      with:
        image: ${{ inputs.artifact_registry }}/${{ inputs.service }}:${{ steps.decide.outputs.tag }}
        key: ${{ inputs.signing_key }}
        keyless: ${{ inputs.signing_keyless }}

    - name: Update GitOps Values
      id: update-gitops
      if: steps.copy.outcome == 'success' && steps.sign.outcome == 'success'
      uses: rollwright/waas/workflow-templates/workload/shared/gitops-repo/update-image-tag@main
      with:
        service: ${{ inputs.service }}
        image_tag: ${{ steps.decide.outputs.tag }}
        image_repository: ${{ inputs.artifact_registry }}/${{ inputs.service }}
        image_digest: ${{ steps.sign.outputs.digest_ref }}
        target: ${{ inputs.target }}
        environment: ${{ inputs.environment }}
        git_token: ${{ inputs.git_token }}
        gitops_repo: ${{ inputs.gitops_repo }}
        git_ref: ${{ inputs.git_ref }}
        result: ${{ steps.sign.outputs.signed == 'true' && format('promoted from {0} and signed', inputs.source_environment) || format('promoted from {0}', inputs.source_environment) }}
        dashboard_url: ${{ inputs.dashboard_url }}
