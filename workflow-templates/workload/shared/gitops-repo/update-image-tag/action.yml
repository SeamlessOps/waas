name: 'Update GitOps Values'
description: >-
  Writes a service's new image into the GitOps repository: the fields its target names (the tag alone by default; the
  repository, the full image or the digest when the services file says so), then commits and pushes.

inputs:
  service:
    description: "The service's values key (e.g. api-staging), for the default target"
    required: true
  image_tag:
    description: 'New image tag to deploy'
    required: true
  image_repository:
    description: 'The image without its tag (registry/name), written where the target asks for the repository or the full image'
    required: false
    default: ''
  image_digest:
    description: 'The image digest (sha256:..., or name@sha256:...). Empty, and the target writes one: read from the registry'
    required: false
    default: ''
  target:
    description: 'Where the image is written, as waas plan gives it ("gitops"). Empty: the tag at services.<service>.tag'
    required: false
    default: ''
  environment:
    description: 'Environment to update'
    required: true
  git_token:
    description: 'GitHub token for pushing changes'
    required: true
  gitops_repo:
    description: 'GitOps repository URL'
    required: false
    default: 'rollwright/products.git'
  git_ref:
    description: 'The GitOps branch to use'
    required: false
    default: 'main'
  git_update_max_retries:
    description: 'Maximum retries for updating GitOps repository'
    required: false
    default: '5'
  git_user_name:
    description: 'GitHub username for pushing changes'
    required: false
    default: "github-actions[bot]"
  git_user_email:
    description: 'GitHub user email for pushing changes'
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  result:
    description: 'What produced the image, for the summary: "built and signed", "promoted from staging"'
    required: false
    default: 'built'
  dashboard_url:
    description: "Link to the deployment in the GitOps controller (e.g. Argo CD); {environment} and {app} (the values file the service is in, environment/<environment>/<app>.yaml) are filled in. Empty: no link"
    required: false
    default: ''

outputs:
  no-changes:
    description: "Toggle to skip deployment if already up-to-date"
    value: ${{ steps.finalize-status.outputs.no-changes }}
  status:
    description: 'The status of the Deployment'
    value: ${{ steps.finalize-status.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Find the values
      id: find
      uses: rollwright/waas/workflow-templates/workload/shared/gitops-repo/values-target@main
      with:
        target: ${{ inputs.target }}
        service: ${{ inputs.service }}
        environment: ${{ inputs.environment }}
        git_token: ${{ inputs.git_token }}
        gitops_repo: ${{ inputs.gitops_repo }}
        git_ref: ${{ inputs.git_ref }}

    - name: Write the image
      id: write
      shell: bash
      env:
        FILE: ${{ steps.find.outputs.file }}
        TAG_AT: ${{ steps.find.outputs.tag }}
        REPOSITORY_AT: ${{ steps.find.outputs.repository }}
        REF_AT: ${{ steps.find.outputs.ref }}
        DIGEST_AT: ${{ steps.find.outputs.digest }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        IMAGE_DIGEST: ${{ inputs.image_digest }}
      run: |
        set -euo pipefail
        if [[ -n "$REPOSITORY_AT$REF_AT" && -z "$IMAGE_REPOSITORY" ]]; then
          echo "::error::The target writes the image repository, and no image_repository was given"
          exit 1
        fi
        export IMAGE_REF="$IMAGE_REPOSITORY:$IMAGE_TAG"
        digest="${IMAGE_DIGEST##*@}"
        if [[ -n "$DIGEST_AT" && -z "$digest" ]]; then
          [[ -n "$IMAGE_REPOSITORY" ]] || { echo "::error::The target writes the digest: give image_digest or image_repository"; exit 1; }
          digest=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' | jq -r .digest)
        fi
        if [[ -n "$DIGEST_AT" && ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::No digest for $IMAGE_REF ('$digest')"
          exit 1
        fi
        export IMAGE_DIGEST="$digest"

        # The paths are checked yq paths; the values go in through strenv, never into the expression.
        [[ -n "$TAG_AT" ]]        && yq -i "$TAG_AT = strenv(IMAGE_TAG)" "$FILE"
        [[ -n "$REPOSITORY_AT" ]] && yq -i "$REPOSITORY_AT = strenv(IMAGE_REPOSITORY)" "$FILE"
        [[ -n "$REF_AT" ]]        && yq -i "$REF_AT = strenv(IMAGE_REF)" "$FILE"
        [[ -n "$DIGEST_AT" ]]     && yq -i "$DIGEST_AT = strenv(IMAGE_DIGEST)" "$FILE"

        # What was written, for the summary
        shown="$IMAGE_TAG"
        [[ -n "$REPOSITORY_AT$REF_AT" ]] && shown="$IMAGE_REF"
        [[ -n "$DIGEST_AT" ]] && shown="$shown@$digest"
        echo "image=$shown" >> "$GITHUB_OUTPUT"

    - name: Commit and Push Changes
      shell: bash
      id: update-gitops
      run: |
        values_file="${{ steps.find.outputs.file }}"

        git config user.name "${{ inputs.git_user_name }}"
        git config user.email "${{ inputs.git_user_email }}"
        git add "$values_file"

        # Check if there are any changes to commit
        if git diff --staged --quiet; then
          echo "✅ No changes to commit - image tag is already set to '${{ inputs.image_tag }}'"

          # Export NO_CHANGES to outputs and ENV
          echo "NO_CHANGES=true" >> $GITHUB_ENV
          echo "no-changes=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        git commit -m "${{ inputs.environment }}: Update ${{
          inputs.service }} to ${{ inputs.image_tag }}"

        # Push with enhanced retry logic and better error handling
        max_retries=${{ inputs.git_update_max_retries }}
        
        for i in $(seq 1 $max_retries); do
          if git pull --rebase origin ${{ inputs.git_ref }}; then
            if git push origin ${{ inputs.git_ref }}; then
              echo "✅ Changes pushed successfully on attempt $i"
              break
            else
              echo "⚠️ Push failed (attempt $i/$max_retries), retrying in 5 seconds..."
              sleep 5
            fi
          else
            echo "::error::Failed to pull and rebase changes from origin/${{ inputs.git_ref }}"
            echo "Please check for merge conflicts or repository permissions."
            exit 1
          fi
          
          if [ $i -eq $max_retries ]; then
            echo "::error::Failed to push changes after $max_retries attempts"
            echo "Please check repository permissions and try again."
            exit 1
          fi
        done

    - name: Set final status output
      if: always()
      id: finalize-status
      shell: bash
      run: |
        if [[ "$NO_CHANGES" == "true" ]]; then
          echo "no-changes=true" >> $GITHUB_OUTPUT
        elif [[ "${{ job.status }}" == "success" ]]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "🚦 Status: ${{ job.status }}"
        elif [[ "${{ job.status }}" == "cancelled" ]]; then
          echo "status=cancelled" >> $GITHUB_OUTPUT
          echo "🚦 Status: ${{ job.status }}"
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "🚦 Status: ${{ job.status }}"
        fi

    - name: Add Success Message
      if: success()
      shell: bash
      env:
        DASHBOARD_URL: ${{ inputs.dashboard_url }}
        VALUES_FILE: ${{ steps.find.outputs.file }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE_TAG: ${{ steps.write.outputs.image || inputs.image_tag }}
        RESULT: ${{ env.NO_CHANGES == 'true' && 'unchanged, the tag is already set' || inputs.result }}
      run: |
        app=$(basename "$VALUES_FILE" .yaml)
        {
          echo "## Deploy"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Service | \`$SERVICE\` |"
          echo "| Environment | $ENVIRONMENT |"
          echo "| Image | \`$IMAGE_TAG\` |"
          echo "| Commit | \`${GITHUB_SHA::7}\` |"
          echo "| Result | $RESULT |"
          echo "| GitOps | \`$VALUES_FILE\` |"
          if [[ -n "$DASHBOARD_URL" ]]; then
            url="${DASHBOARD_URL//\{environment\}/$ENVIRONMENT}"
            echo ""
            echo "[View the deployment](${url//\{app\}/$app})"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Add Failure Message
      if: failure()
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        {
          echo "## Deploy failed"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Service | \`$SERVICE\` |"
          echo "| Environment | $ENVIRONMENT |"
          echo "| Run | [logs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
        } >> "$GITHUB_STEP_SUMMARY"
