name: 'Confirm GitOps Values'
description: >-
  Says whether the GitOps values already hold the image this run would write (re-runs skip the build): every field
  the target names but the digest, which is only known once the image is built.

inputs:
  service:
    description: "The service's values key (e.g. api-staging), for the default target"
    required: true
  image_tag:
    description: 'The image tag this run deploys'
    required: true
  image_repository:
    description: 'The image without its tag (registry/name), compared where the target writes the repository or the full image'
    required: false
    default: ''
  target:
    description: 'Where the image is written, as waas plan gives it ("gitops"). Empty: the tag at services.<service>.tag'
    required: false
    default: ''
  environment:
    description: 'Environment to update'
    required: true
  git_token:
    description: 'GitHub token for pushing changes'
    required: true
  gitops_repo:
    description: 'GitOps repository URL'
    required: false
    default: 'rollwright/products.git'
  git_ref:
    description: 'The GitOps branch to use'
    required: false
    default: 'main'
  dashboard_url:
    description: "Link to the deployment in the GitOps controller (e.g. Argo CD); {environment} and {app} (the values file the service is in, environment/<environment>/<app>.yaml) are filled in. Empty: no link"
    required: false
    default: ''

outputs:
  no-changes:
    description: 'Toggle to skip build and publish if image is up-to-date'
    value: ${{ steps.confirm-image-tag.outputs.no-changes }}

runs:
  using: "composite"
  steps:
    - name: Find the values
      id: find
      uses: rollwright/waas/workflow-templates/workload/shared/gitops-repo/values-target@main
      with:
        target: ${{ inputs.target }}
        service: ${{ inputs.service }}
        environment: ${{ inputs.environment }}
        git_token: ${{ inputs.git_token }}
        gitops_repo: ${{ inputs.gitops_repo }}
        git_ref: ${{ inputs.git_ref }}

    - name: Confirm if Image Tag Needs Update
      id: confirm-image-tag
      shell: bash
      env:
        FILE: ${{ steps.find.outputs.file }}
        TAG_AT: ${{ steps.find.outputs.tag }}
        REPOSITORY_AT: ${{ steps.find.outputs.repository }}
        REF_AT: ${{ steps.find.outputs.ref }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      run: |
        set -euo pipefail
        # Each field the run would write, beside what the file holds; any difference deploys.
        same=true compared=0
        check() {
          local at="$1" want="$2" have
          [[ -n "$at" ]] || return 0
          compared=$((compared + 1))
          have=$(yq eval "$at // \"\"" "$FILE")
          echo "[DEBUG] ℹ️ $at: '$have', this run: '$want'"
          [[ "$have" == "$want" ]] || same=false
        }
        check "$TAG_AT" "$IMAGE_TAG"
        check "$REPOSITORY_AT" "$IMAGE_REPOSITORY"
        check "$REF_AT" "$IMAGE_REPOSITORY:$IMAGE_TAG"
        # A digest alone can't be compared before the build: deploy.
        [[ "$compared" -gt 0 ]] || same=false

        if [[ "$same" == "true" ]]; then
          echo "✅ The values already hold this run's image"
        else
          echo "ℹ️ Updating to this run's image"
        fi
        echo "no-changes=$same" >> "$GITHUB_OUTPUT"
        echo "NO_CHANGES=$same" >> "$GITHUB_ENV"

    - name: Add Success Message
      if: success() && steps.confirm-image-tag.outputs.no-changes == 'true'
      shell: bash
      env:
        DASHBOARD_URL: ${{ inputs.dashboard_url }}
        VALUES_FILE: ${{ steps.find.outputs.file }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        RESULT: unchanged, the tag is already set
      run: |
        app=$(basename "$VALUES_FILE" .yaml)
        {
          echo "## Deploy"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Service | \`$SERVICE\` |"
          echo "| Environment | $ENVIRONMENT |"
          echo "| Image | \`$IMAGE_TAG\` |"
          echo "| Commit | \`${GITHUB_SHA::7}\` |"
          echo "| Result | $RESULT |"
          echo "| GitOps | \`$VALUES_FILE\` |"
          if [[ -n "$DASHBOARD_URL" ]]; then
            url="${DASHBOARD_URL//\{environment\}/$ENVIRONMENT}"
            echo ""
            echo "[View the deployment](${url//\{app\}/$app})"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Add Failure Message
      if: failure()
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        {
          echo "## Deploy failed"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Service | \`$SERVICE\` |"
          echo "| Environment | $ENVIRONMENT |"
          echo "| Run | [logs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
        } >> "$GITHUB_STEP_SUMMARY"
