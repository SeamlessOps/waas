name: 'Update GitOps Values'
description: 'Updates GitOps repository with new image tags'

inputs:
  service:
    description: 'Service name to update'
    required: true
  image_tag:
    description: 'New image tag to deploy'
    required: false
    default: 'build-${GITHUB_RUN_NUMBER}-sha-${GITHUB_SHA::7}'
  environment:
    description: 'Environment to update'
    required: true
  git_token:
    description: 'GitHub token for pushing changes'
    required: true
  gitops_repo:
    description: 'GitOps repository URL'
    required: false
    default: 'rollwright/products.git'
  git_ref:
    description: 'The GitOps branch to use'
    required: false
    default: 'main'
  dashboard_url:
    description: "Link to the deployment in the GitOps controller (e.g. Argo CD); {environment} and {app} (the values file the service is in, environment/<environment>/<app>.yaml) are filled in. Empty: no link"
    required: false
    default: ''

outputs:
  no-changes:
    description: 'Toggle to skip build and publish if image is up-to-date'
    value: ${{ steps.confirm-image-tag.outputs.no-changes }}

runs:
  using: "composite"
  steps:
    - name: Set values path
      id: values
      shell: bash
      run: |
        echo "values_dir=environment/${{ inputs.environment }}" >> $GITHUB_OUTPUT

    - name: Checkout GitOps Repository
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.gitops_repo }}
        token: ${{ inputs.git_token }}
        ref: ${{ inputs.git_ref }}
        sparse-checkout: ${{ steps.values.outputs.values_dir }}
        sparse-checkout-cone-mode: false
        fetch-depth: 1

    - name: Install yq
      shell: bash
      run: |
        set -euo pipefail
        sudo wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/bin/yq

    - name: Find the values file
      id: find
      shell: bash
      run: |
        # The one file under environment/<env> that holds the service (one file per app, e.g. backend.yaml)
        matches=()
        for f in ${{ steps.values.outputs.values_dir }}/*.yaml; do
          [ -f "$f" ] || continue
          if yq -e '.services | has("${{ inputs.service }}")' "$f" >/dev/null 2>&1; then matches+=("$f"); fi
        done
        if [ "${#matches[@]}" -ne 1 ]; then
          echo "::error::Service ${{ inputs.service }} must be in exactly one file under ${{ steps.values.outputs.values_dir }}, found ${#matches[@]}: ${matches[*]:-none}"
          exit 1
        fi
        echo "values_file=${matches[0]}" >> $GITHUB_OUTPUT
        echo "✅ Values file for ${{ inputs.service }}: ${matches[0]}"

    - name: Confirm if Image Tag Needs Update
      id: confirm-image-tag
      shell: bash
      run: |
        values_file="${{ steps.find.outputs.values_file }}"
        current_tag=$(yq eval ".services.${{ inputs.service }}.tag" "$values_file")

        # Debug tags
        echo "[DEBUG] ℹ️ Current tag: $current_tag"
        echo "[DEBUG] ℹ️ New tag: ${{ inputs.image_tag }}"

        if [ "$current_tag" = "${{ inputs.image_tag }}" ]; then
          echo "✅ Image tag already up-to-date: $current_tag"
          echo "no-changes=true" >> $GITHUB_OUTPUT
          echo "NO_CHANGES=true" >> $GITHUB_ENV
          exit 0
        else
          echo "ℹ️ Current tag: $current_tag, updating to: ${{ inputs.image_tag }}"
          echo "no-changes=false" >> $GITHUB_OUTPUT
          echo "NO_CHANGES=false" >> $GITHUB_ENV
        fi

    - name: Add Success Message
      if: success() && steps.confirm-image-tag.outputs.no-changes == 'true'
      shell: bash
      env:
        DASHBOARD_URL: ${{ inputs.dashboard_url }}
        VALUES_FILE: ${{ steps.find.outputs.values_file }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        RESULT: unchanged, the tag is already set
      run: |
        app=$(basename "$VALUES_FILE" .yaml)
        {
          echo "## Deploy"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Service | \`$SERVICE\` |"
          echo "| Environment | $ENVIRONMENT |"
          echo "| Image | \`$IMAGE_TAG\` |"
          echo "| Commit | \`${GITHUB_SHA::7}\` |"
          echo "| Result | $RESULT |"
          echo "| GitOps | \`$VALUES_FILE\` |"
          if [[ -n "$DASHBOARD_URL" ]]; then
            url="${DASHBOARD_URL//\{environment\}/$ENVIRONMENT}"
            echo ""
            echo "[View the deployment](${url//\{app\}/$app})"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Add Failure Message
      if: failure()
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        {
          echo "## Deploy failed"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Service | \`$SERVICE\` |"
          echo "| Environment | $ENVIRONMENT |"
          echo "| Run | [logs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
        } >> "$GITHUB_STEP_SUMMARY"
